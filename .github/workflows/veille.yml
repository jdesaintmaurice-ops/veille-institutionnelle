name: Veille institutionnelle

on:
  schedule:
    # 6h00 UTC = 8h00 heure de Paris (été). Ajuster à '0 7 * * *' en hiver.
    - cron: '0 6 * * *'
  workflow_dispatch:   # permet aussi de lancer manuellement depuis GitHub

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restaurer la mémoire (déjà-vus)
        uses: actions/cache@v4
        with:
          path: deja_vus.json
          key: deja-vus-${{ github.run_id }}
          restore-keys: |
            deja-vus-

      - name: Lancer la veille
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
          GMAIL_UTILISATEUR: ${{ secrets.GMAIL_UTILISATEUR }}
          GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}
          MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE }}
        run: python veille_github.py
